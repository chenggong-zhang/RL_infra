<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Naive memory layout cannot fit both SGLang and FSDP</title>
  <desc id="desc">SGLang uses CUDA graph, KV cache, and serving model memory. FSDP uses training model, gradients, optimizer states, and activations. Keeping both resident on the same GPU allocation exceeds memory.</desc>
  <defs>
    <pattern id="blue-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#eaf6ff"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8ecaf8" stroke-width="2"/>
    </pattern>
    <pattern id="green-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#effcee"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8cdf9b" stroke-width="2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#25222a"/>
    </marker>
    <style>
      .bg{fill:#fbfaf7}.outer{fill:#fff;stroke:#24222a;stroke-width:2.2;rx:20}.blue{fill:url(#blue-hatch);stroke:#24222a;stroke-width:1.8;rx:14}.green{fill:url(#green-hatch);stroke:#24222a;stroke-width:1.8;rx:14}
      .title{font:700 28px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24222a}.label{font:700 26px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24222a}.small{font:600 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5d5862}.warn{font:700 24px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#2b2730}.wire{fill:none;stroke:#25222a;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1400" height="760"/>
  <text class="title" x="74" y="54">v0: keep both runtimes resident</text>

  <rect class="outer" x="280" y="86" width="430" height="570"/>
  <text class="label" x="440" y="126">SGLang</text>
  <rect class="blue" x="300" y="150" width="390" height="62"/>
  <text class="label" x="418" y="191">CUDA Graph</text>
  <rect class="blue" x="300" y="232" width="390" height="190"/>
  <text class="label" x="433" y="334">KV Cache</text>
  <rect class="blue" x="300" y="442" width="390" height="156"/>
  <text class="label" x="390" y="529">Serving Model</text>
  <rect x="280" y="598" width="430" height="58" fill="#fff"/>
  <text class="small" x="326" y="632">remaining GPU capacity is not enough</text>

  <rect class="outer" x="810" y="146" width="430" height="476"/>
  <text class="label" x="982" y="195">FSDP</text>
  <rect class="green" x="834" y="226" width="382" height="64"/>
  <text class="label" x="914" y="268">Training Model</text>
  <rect class="green" x="834" y="306" width="382" height="52"/>
  <text class="label" x="964" y="341">Gradients</text>
  <rect class="green" x="834" y="374" width="382" height="112"/>
  <text class="label" x="918" y="439">Optimizer States</text>
  <rect class="green" x="834" y="506" width="382" height="94"/>
  <text class="label" x="952" y="563">Activations</text>

  <path class="wire" d="M808 470 C762 522,742 557,710 590"/>
  <text class="warn" x="542" y="716">Cannot fit into the memory!!!</text>
</svg>
