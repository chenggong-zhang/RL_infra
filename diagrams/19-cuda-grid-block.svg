<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>CUDA launch: host code creates a logical grid, GPU scheduler runs blocks on SMs</title>
  <desc>A clearer diagram showing host launch syntax, a logical CUDA grid with blocks and threads, and physical SM scheduling.</desc>
  <defs>
    <style>
      .title { font-size: 25px; font-weight: 760; fill: #27262b; }
      .subtitle { font-size: 14px; fill: #5d5964; }
      .step { font-size: 13px; font-weight: 760; fill: #ffffff; }
      .label { font-size: 17px; font-weight: 730; fill: #27262b; }
      .text { font-size: 13px; fill: #5d5964; }
      .small { font-size: 12px; fill: #77727d; }
      .code { font-size: 15px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #27262b; }
      .code-small { font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5d5964; }
      .arrow { fill: none; stroke: #4f4a58; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow19" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f4a58"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" class="title">CUDA launch: from code shape to hardware placement</text>
  <text x="550" y="70" text-anchor="middle" class="subtitle">The programmer chooses a logical grid. The GPU scheduler decides which physical SM runs each block.</text>

  <!-- Step 1: host launch -->
  <rect x="60" y="120" width="300" height="405" rx="16" fill="#fffdf7" stroke="#b85c00" stroke-width="2"/>
  <circle cx="92" cy="152" r="16" fill="#b85c00"/>
  <text x="92" y="157" text-anchor="middle" class="step">1</text>
  <text x="120" y="157" class="label">Host launch</text>
  <text x="92" y="190" class="text">CPU-side code asks the GPU</text>
  <text x="92" y="211" class="text">to run many copies of a kernel.</text>

  <rect x="90" y="245" width="240" height="88" rx="10" fill="#ffffff" stroke="#e0b06f"/>
  <text x="110" y="277" class="code">add_kernel&lt;&lt;&lt;</text>
  <text x="135" y="302" class="code">num_blocks, block_size</text>
  <text x="110" y="327" class="code">&gt;&gt;&gt;(...)</text>

  <rect x="90" y="370" width="240" height="96" rx="10" fill="#ffffff" stroke="#e0b06f"/>
  <text x="110" y="401" class="code-small">num_blocks</text>
  <text x="204" y="401" class="text">how many blocks</text>
  <text x="110" y="431" class="code-small">block_size</text>
  <text x="204" y="431" class="text">threads per block</text>

  <!-- Step 2: logical grid -->
  <rect x="415" y="120" width="330" height="405" rx="16" fill="#f7f2ff" stroke="#7253ed" stroke-width="2"/>
  <circle cx="447" cy="152" r="16" fill="#7253ed"/>
  <text x="447" y="157" text-anchor="middle" class="step">2</text>
  <text x="475" y="157" class="label">Logical CUDA grid</text>
  <text x="447" y="190" class="text">The launch creates blocks.</text>
  <text x="447" y="211" class="text">Each block contains many threads.</text>

  <g>
    <rect x="450" y="245" width="125" height="82" rx="10" fill="#ffffff" stroke="#7253ed"/>
    <text x="512" y="273" text-anchor="middle" class="small">blockIdx.x = 0</text>
    <circle cx="475" cy="303" r="5" fill="#7253ed"/><circle cx="494" cy="303" r="5" fill="#7253ed"/><circle cx="513" cy="303" r="5" fill="#7253ed"/><circle cx="532" cy="303" r="5" fill="#7253ed"/><circle cx="551" cy="303" r="5" fill="#7253ed"/>

    <rect x="595" y="245" width="125" height="82" rx="10" fill="#ffffff" stroke="#7253ed"/>
    <text x="657" y="273" text-anchor="middle" class="small">blockIdx.x = 1</text>
    <circle cx="620" cy="303" r="5" fill="#7253ed"/><circle cx="639" cy="303" r="5" fill="#7253ed"/><circle cx="658" cy="303" r="5" fill="#7253ed"/><circle cx="677" cy="303" r="5" fill="#7253ed"/><circle cx="696" cy="303" r="5" fill="#7253ed"/>

    <rect x="450" y="350" width="125" height="82" rx="10" fill="#ffffff" stroke="#7253ed"/>
    <text x="512" y="378" text-anchor="middle" class="small">blockIdx.x = 2</text>
    <circle cx="475" cy="408" r="5" fill="#7253ed"/><circle cx="494" cy="408" r="5" fill="#7253ed"/><circle cx="513" cy="408" r="5" fill="#7253ed"/><circle cx="532" cy="408" r="5" fill="#7253ed"/><circle cx="551" cy="408" r="5" fill="#7253ed"/>

    <rect x="595" y="350" width="125" height="82" rx="10" fill="#ffffff" stroke="#7253ed"/>
    <text x="657" y="386" text-anchor="middle" class="small">...</text>
    <text x="657" y="409" text-anchor="middle" class="small">more blocks</text>
  </g>

  <rect x="452" y="460" width="265" height="42" rx="9" fill="#ffffff" stroke="#d6cdf8"/>
  <text x="584" y="486" text-anchor="middle" class="code-small">i = blockIdx.x * blockDim.x + threadIdx.x</text>

  <!-- Step 3: physical scheduling -->
  <rect x="800" y="120" width="240" height="405" rx="16" fill="#eefaf6" stroke="#026e57" stroke-width="2"/>
  <circle cx="832" cy="152" r="16" fill="#026e57"/>
  <text x="832" y="157" text-anchor="middle" class="step">3</text>
  <text x="860" y="157" class="label">Physical SMs</text>
  <text x="832" y="190" class="text">Blocks are scheduled onto</text>
  <text x="832" y="211" class="text">available streaming multiprocessors.</text>

  <rect x="835" y="250" width="78" height="64" rx="10" fill="#ffffff" stroke="#026e57"/>
  <text x="874" y="277" text-anchor="middle" class="small">SM 0</text>
  <text x="874" y="296" text-anchor="middle" class="small">block</text>

  <rect x="930" y="250" width="78" height="64" rx="10" fill="#ffffff" stroke="#026e57"/>
  <text x="969" y="277" text-anchor="middle" class="small">SM 1</text>
  <text x="969" y="296" text-anchor="middle" class="small">block</text>

  <rect x="835" y="350" width="78" height="64" rx="10" fill="#ffffff" stroke="#026e57"/>
  <text x="874" y="377" text-anchor="middle" class="small">SM 2</text>
  <text x="874" y="396" text-anchor="middle" class="small">block</text>

  <rect x="930" y="350" width="78" height="64" rx="10" fill="#ffffff" stroke="#026e57"/>
  <text x="969" y="377" text-anchor="middle" class="small">SM n</text>
  <text x="969" y="396" text-anchor="middle" class="small">block</text>

  <text x="920" y="468" text-anchor="middle" class="small">logical block ids do not have to</text>
  <text x="920" y="488" text-anchor="middle" class="small">match physical SM ids</text>

  <!-- Flow arrows -->
  <path class="arrow" d="M 360 320 C 382 320 392 320 414 320" marker-end="url(#arrow19)"/>
  <path class="arrow" d="M 745 320 C 770 300 775 295 799 286" marker-end="url(#arrow19)"/>
  <path class="arrow" d="M 745 410 C 770 430 775 435 799 386" marker-end="url(#arrow19)"/>
</svg>
