<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>GPU software stack for RL infrastructure</title>
  <desc>A simplified layered diagram from RL frameworks down to GPU hardware, showing where CUDA, PyTorch, Triton, TileLang, and Python fit.</desc>

  <defs>
    <marker id="arrow17" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b3942"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: 750; fill: #27262b; }
      .subtitle { font-size: 15px; fill: #5c5962; }
      .layer-title { font-size: 18px; font-weight: 750; fill: #27262b; }
      .layer-text { font-size: 14px; fill: #5c5962; }
      .small { font-size: 12px; fill: #77727d; }
      .tag { font-size: 13px; font-weight: 650; }
      .arrow { fill: none; stroke: #4f4a58; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1100" height="700" fill="#ffffff"/>

  <text x="550" y="42" text-anchor="middle" class="title">GPU software stack for RL infrastructure</text>
  <text x="550" y="70" text-anchor="middle" class="subtitle">The same word "Python" can mean framework code, tensor code, CUDA bindings, or a kernel DSL.</text>

  <!-- Top layer -->
  <rect x="120" y="100" width="860" height="74" rx="10" fill="#f7f2ff" stroke="#7253ed" stroke-width="2"/>
  <text x="150" y="130" class="layer-title">RL framework / orchestrator</text>
  <text x="150" y="156" class="layer-text">verl · slime · Miles · OpenRLHF · AReaL</text>
  <text x="820" y="130" text-anchor="middle" class="tag" fill="#5f3ceb">ordinary Python</text>
  <text x="820" y="153" text-anchor="middle" class="small">control flow</text>

  <!-- Engines -->
  <rect x="120" y="210" width="410" height="82" rx="10" fill="#eefaf6" stroke="#026e57" stroke-width="2"/>
  <text x="150" y="242" class="layer-title">Training engines</text>
  <text x="150" y="268" class="layer-text">PyTorch · Megatron · FSDP</text>
  <text x="420" y="242" text-anchor="middle" class="tag" fill="#026e57">loss + backward</text>
  <text x="420" y="265" text-anchor="middle" class="small">optimizer.step</text>

  <rect x="570" y="210" width="410" height="82" rx="10" fill="#eefaf6" stroke="#026e57" stroke-width="2"/>
  <text x="600" y="242" class="layer-title">Inference engines</text>
  <text x="600" y="268" class="layer-text">SGLang · vLLM · TensorRT-LLM</text>
  <text x="870" y="242" text-anchor="middle" class="tag" fill="#026e57">generate</text>
  <text x="870" y="265" text-anchor="middle" class="small">KV cache · batching</text>

  <!-- PyTorch -->
  <rect x="120" y="330" width="860" height="72" rx="10" fill="#f9fafc" stroke="#c8c2cf" stroke-width="2"/>
  <text x="150" y="360" class="layer-title">PyTorch operator layer</text>
  <text x="150" y="386" class="layer-text">tensor ops · autograd · custom ops · torch.compile</text>
  <text x="820" y="360" text-anchor="middle" class="tag" fill="#5c5962">tensor Python</text>
  <text x="820" y="383" text-anchor="middle" class="small">dispatches kernels</text>

  <!-- Dispatch layer -->
  <rect x="270" y="440" width="560" height="60" rx="10" fill="#fffdf7" stroke="#b85c00" stroke-width="2"/>
  <text x="550" y="467" text-anchor="middle" class="layer-title">Kernel dispatch / compiled operators</text>
  <text x="550" y="490" text-anchor="middle" class="layer-text">choose or launch the concrete GPU work</text>

  <!-- Low-level choices -->
  <rect x="120" y="535" width="260" height="76" rx="10" fill="#fff7e8" stroke="#b85c00" stroke-width="2"/>
  <text x="150" y="565" class="layer-title">CUDA APIs</text>
  <text x="150" y="590" class="layer-text">runtime · memory · streams</text>

  <rect x="420" y="535" width="260" height="76" rx="10" fill="#fff7e8" stroke="#b85c00" stroke-width="2"/>
  <text x="450" y="565" class="layer-title">Kernel DSLs</text>
  <text x="450" y="590" class="layer-text">Triton · TileLang</text>

  <rect x="720" y="535" width="260" height="76" rx="10" fill="#fff7e8" stroke="#b85c00" stroke-width="2"/>
  <text x="750" y="565" class="layer-title">Vendor libraries</text>
  <text x="750" y="590" class="layer-text">cuBLAS · NCCL · CUTLASS</text>

  <!-- Hardware -->
  <rect x="120" y="640" width="860" height="42" rx="10" fill="#27262b" stroke="#27262b" stroke-width="2"/>
  <text x="150" y="666" font-size="17" font-weight="750" fill="#ffffff">NVIDIA GPU hardware</text>
  <text x="420" y="666" font-size="13" fill="#dad5e6">SMs · warps · tensor cores · registers · shared memory · HBM</text>

  <!-- Arrows -->
  <path class="arrow" d="M 488 175 C 448 192 376 198 325 209" marker-end="url(#arrow17)"/>
  <path class="arrow" d="M 612 175 C 652 192 724 198 775 209" marker-end="url(#arrow17)"/>
  <path class="arrow" d="M 325 293 V 329" marker-end="url(#arrow17)"/>
  <path class="arrow" d="M 775 293 V 329" marker-end="url(#arrow17)"/>
  <path class="arrow" d="M 550 403 V 439" marker-end="url(#arrow17)"/>
  <path class="arrow" d="M 550 501 V 520"/>
  <path class="arrow" d="M 550 520 H 250 V 534" marker-end="url(#arrow17)"/>
  <path class="arrow" d="M 550 520 V 534" marker-end="url(#arrow17)"/>
  <path class="arrow" d="M 550 520 H 850 V 534" marker-end="url(#arrow17)"/>
  <path class="arrow" d="M 250 612 V 639" marker-end="url(#arrow17)"/>
  <path class="arrow" d="M 550 612 V 639" marker-end="url(#arrow17)"/>
  <path class="arrow" d="M 850 612 V 639" marker-end="url(#arrow17)"/>
</svg>
