<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>GPU memory hierarchy and tiling</title>
  <desc>A diagram showing HBM, L2, shared memory, registers, and tiled data reuse.</desc>
  <defs>
    <style>
      .title { font-size: 26px; font-weight: 760; fill: #27262b; }
      .label { font-size: 18px; font-weight: 720; fill: #27262b; }
      .text { font-size: 14px; fill: #5d5964; }
      .small { font-size: 12px; fill: #77727d; }
      .arrow { fill: none; stroke: #4f4a58; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow20" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f4a58"/>
    </marker>
  </defs>

  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="46" text-anchor="middle" class="title">Why memory layout matters</text>
  <text x="550" y="75" text-anchor="middle" class="text">Fast kernels reuse data after paying the cost of bringing it closer to the arithmetic units.</text>

  <rect x="90" y="120" width="920" height="70" rx="12" fill="#f7f2ff" stroke="#7253ed" stroke-width="2"/>
  <text x="120" y="150" class="label">HBM / global GPU memory</text>
  <text x="120" y="174" class="text">large, persistent during the kernel, expensive to read repeatedly</text>

  <rect x="190" y="225" width="720" height="58" rx="12" fill="#f9fafc" stroke="#c8c2cf" stroke-width="2"/>
  <text x="220" y="260" class="label">L2 cache</text>
  <text x="390" y="260" class="text">hardware cache shared across SMs</text>

  <rect x="285" y="320" width="530" height="65" rx="12" fill="#eefaf6" stroke="#026e57" stroke-width="2"/>
  <text x="315" y="348" class="label">Shared memory</text>
  <text x="315" y="370" class="text">programmer-managed scratchpad inside one SM/block</text>

  <rect x="390" y="425" width="320" height="55" rx="12" fill="#fff7e8" stroke="#b85c00" stroke-width="2"/>
  <text x="420" y="458" class="label">Registers</text>
  <text x="540" y="458" class="text">per-thread, fastest, tiny</text>

  <path class="arrow" d="M 550 191 V 224" marker-end="url(#arrow20)"/>
  <path class="arrow" d="M 550 284 V 319" marker-end="url(#arrow20)"/>
  <path class="arrow" d="M 550 386 V 424" marker-end="url(#arrow20)"/>

  <rect x="760" y="415" width="250" height="62" rx="10" fill="#fffdf7" stroke="#b85c00" stroke-width="2"/>
  <text x="885" y="440" text-anchor="middle" class="small">tiling goal</text>
  <text x="885" y="462" text-anchor="middle" class="text">load once, reuse many times</text>
  <path class="arrow" d="M 760 446 C 720 446 720 352 816 352" marker-end="url(#arrow20)"/>
</svg>
