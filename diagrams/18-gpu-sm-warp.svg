<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>GPU, SM, warp, and lane hierarchy</title>
  <desc>A simple hierarchy diagram showing a GPU containing many SMs, each SM running blocks, warps, and lanes.</desc>
  <defs>
    <style>
      .title { font-size: 26px; font-weight: 760; fill: #27262b; }
      .label { font-size: 18px; font-weight: 720; fill: #27262b; }
      .text { font-size: 14px; fill: #5d5964; }
      .small { font-size: 12px; fill: #77727d; }
      .box { rx: 12; stroke-width: 2; }
      .arrow { fill: none; stroke: #4f4a58; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow18" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f4a58"/>
    </marker>
  </defs>

  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="46" text-anchor="middle" class="title">From GPU to lanes</text>
  <text x="550" y="75" text-anchor="middle" class="text">A GPU is many local execution units, not one giant sequential core.</text>

  <rect x="60" y="115" width="980" height="360" class="box" fill="#f7f2ff" stroke="#7253ed"/>
  <text x="90" y="150" class="label">GPU</text>
  <text x="90" y="174" class="text">many streaming multiprocessors (SMs)</text>

  <g>
    <rect x="120" y="210" width="250" height="190" class="box" fill="#eefaf6" stroke="#026e57"/>
    <text x="145" y="242" class="label">SM 0</text>
    <text x="145" y="266" class="text">schedulers · registers</text>
    <text x="145" y="287" class="text">shared memory · arithmetic units</text>
    <rect x="145" y="320" width="88" height="44" rx="8" fill="#ffffff" stroke="#88b9aa"/>
    <rect x="255" y="320" width="88" height="44" rx="8" fill="#ffffff" stroke="#88b9aa"/>
    <text x="189" y="347" text-anchor="middle" class="small">block</text>
    <text x="299" y="347" text-anchor="middle" class="small">block</text>
  </g>

  <g>
    <rect x="425" y="210" width="250" height="190" class="box" fill="#eefaf6" stroke="#026e57"/>
    <text x="450" y="242" class="label">SM 1</text>
    <text x="450" y="266" class="text">runs other blocks</text>
    <text x="450" y="287" class="text">while SM 0 is also busy</text>
    <rect x="450" y="320" width="88" height="44" rx="8" fill="#ffffff" stroke="#88b9aa"/>
    <rect x="560" y="320" width="88" height="44" rx="8" fill="#ffffff" stroke="#88b9aa"/>
    <text x="494" y="347" text-anchor="middle" class="small">block</text>
    <text x="604" y="347" text-anchor="middle" class="small">block</text>
  </g>

  <g>
    <rect x="730" y="210" width="250" height="190" class="box" fill="#eefaf6" stroke="#026e57"/>
    <text x="755" y="242" class="label">SM n</text>
    <text x="755" y="266" class="text">same local machinery</text>
    <text x="755" y="287" class="text">different scheduled blocks</text>
    <rect x="755" y="320" width="88" height="44" rx="8" fill="#ffffff" stroke="#88b9aa"/>
    <rect x="865" y="320" width="88" height="44" rx="8" fill="#ffffff" stroke="#88b9aa"/>
    <text x="799" y="347" text-anchor="middle" class="small">block</text>
    <text x="909" y="347" text-anchor="middle" class="small">block</text>
  </g>

  <rect x="230" y="495" width="640" height="42" rx="10" fill="#fff7e8" stroke="#b85c00" stroke-width="2"/>
  <text x="550" y="521" text-anchor="middle" class="text">Inside a block, threads execute in warps; a warp is usually 32 lanes running one instruction on different data.</text>

  <path class="arrow" d="M 245 401 C 300 440 410 465 550 494" marker-end="url(#arrow18)"/>
</svg>
